name: Data finding
description: A volume you think is mis-scored, an unscored volume, or a label-coverage gap
labels: [data-finding]
body:
  - type: markdown
    attributes:
      value: |
        Findings live or die on reproducibility. Give us the command and the
        artifact — a finding without a reproducible command will be asked for one.
  - type: input
    id: root
    attributes:
      label: Volume root
      description: "Full root, e.g. `community-uploads/forrest/volcomp/PHerc0009B/volumes/....zarr`"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of finding
      options:
        - mis-scored volume (score doesn't match the data)
        - dead slice / acquisition dropout
        - label-coverage gap ("label next" candidate)
        - scoring method issue
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Full command and flags that reproduce your observation.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed vs. expected
      description: What the data shows and why the current score/behavior is wrong.
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Evidence
      description: Paste key JSON/numbers or link the artifact (volumes.json entry, report).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Build sdist and wheel
        run: python -m build
      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Smoke-test installed console scripts
        run: |
          cd "$(mktemp -d)"
          python - <<'PYCODE'
          import importlib.metadata
          import subprocess
          for ep in importlib.metadata.distribution("scrollq").entry_points:
              if ep.group == "console_scripts":
                  subprocess.run([ep.name, "--help"], check=True)
          PYCODE


  container:
    name: reviewer container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned reviewer image
        run: |
          BUILD_DATE="$(git show -s --format=%cI HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            -t "scrollq-ci:$GITHUB_SHA" \
            .
      - name: Verify container contract
        run: |
          IMAGE="scrollq-ci:$GITHUB_SHA"
          test "$(docker run --rm "$IMAGE" id -u)" = "10001"
          test "$(docker inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"
          docker run --rm "$IMAGE" scroliq-provenance --help >/dev/null
          docker run --rm "$IMAGE" scroliq-package --help >/dev/null
          docker run --rm "$IMAGE" scroliq-submission-image --help >/dev/null
          docker run --rm "$IMAGE" scroliq-legibility --help >/dev/null
          docker run --rm "$IMAGE" scroliq-vc3d-review --help >/dev/null
          docker run --rm "$IMAGE" scroliq-vc3d-review-ingest --help >/dev/null
          docker run --rm "$IMAGE" scroliq-spiral-transfer --help >/dev/null
          docker run --rm "$IMAGE" scroliq-spiral-export --help >/dev/null
          docker run --rm "$IMAGE" zpa-gate --help >/dev/null
          docker run --rm "$IMAGE" python -c "import scrollq, zpa; print('container imports: ok')"

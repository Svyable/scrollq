name: PHercParis4 winding ray-order audit

on:
  workflow_dispatch:
  push:
    branches:
      - scroliq-paris4-ray-order
    paths:
      - .github/workflows/paris4-winding-ray-order.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .

      - name: Fetch published spiral-input annotations
        run: |
          set -euxo pipefail
          base="https://dl.ash2txt.org/datasets/spiral_datasets/PHercParis4"
          mkdir -p input
          for f in umbilicus.json abs_winding.json relative_windings.json same_windings.json; do
            curl -fsSL --retry 4 -o "input/$f" "$base/$f" || rm -f "input/$f"
          done
          test -f input/umbilicus.json
          sha256sum input/*.json

      - name: Run winding audit with umbilicus ray order
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          out="artifacts/2026-10-01-paris4-winding-ray-order"
          mkdir -p "$out"
          # Exit status 1 means a structural failure; keep the report either way.
          scroliq-winding --dataset input --out "$out/PHercParis4.winding-audit.json" \
            | tee "$out/summary.txt" || true
          test -s "$out/PHercParis4.winding-audit.json"
          {
            echo "# PHercParis4 winding ray-order audit"
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "Inputs: https://dl.ash2txt.org/datasets/spiral_datasets/PHercParis4/"
            echo
            echo '```bash'
            echo 'scroliq-winding --dataset <spiral-input PHercParis4 root> --out PHercParis4.winding-audit.json'
            echo '```'
            echo
            echo '```'
            cat "$out/summary.txt"
            echo '```'
            echo
            echo "Inversions are review candidates, not errors: folding can legitimately"
            echo "break ray order. Treat the review queue as a list of annotations to open"
            echo "in VC3D, and record which were confirmed mis-numbered before citing any"
            echo "precision figure."
          } > "$out/README.md"

      - name: Commit audit artifacts
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-10-01-paris4-winding-ray-order
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add PHercParis4 winding ray-order audit artifacts"
          git push origin HEAD:scroliq-paris4-ray-order

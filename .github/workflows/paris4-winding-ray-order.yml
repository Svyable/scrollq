name: PHercParis4 winding ray-order audit

on:
  workflow_dispatch:
  push:
    branches:
      - scroliq-paris4-ray-order
    paths:
      - .github/workflows/paris4-winding-ray-order.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .

      - name: Fetch published spiral-input annotations
        run: |
          set -euxo pipefail
          base="https://dl.ash2txt.org/datasets/spiral_datasets/PHercParis4"
          mkdir -p input
          for f in umbilicus.json abs_winding.json relative_windings.json same_windings.json; do
            curl -fsSL --retry 4 -o "input/$f" "$base/$f" || rm -f "input/$f"
          done
          test -f input/umbilicus.json
          sha256sum input/*.json

      - name: Run winding audit with umbilicus ray order
        run: |
          set -euxo pipefail
          out="artifacts/2026-10-01-paris4-winding-ray-order"
          mkdir -p "$out"
          # Exit status 1 means a structural failure; keep the report either way.
          scroliq-winding --dataset input --out "$out/PHercParis4.winding-audit.json" \
            > "$out/summary.txt" || true
          test -s "$out/PHercParis4.winding-audit.json"

      - name: Run injection control on the same annotations
        run: |
          set -euxo pipefail
          out="artifacts/2026-10-01-paris4-winding-ray-order"
          python bin/ray_order_control.py input "$out/injection-control.json" \
            --injections 200 --shifts 2,3,5 --seed 0 | tee "$out/injection-control.txt"

      - name: Write artifact README
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          out="artifacts/2026-10-01-paris4-winding-ray-order"
          {
            echo "# PHercParis4 winding ray-order audit"
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "Inputs: https://dl.ash2txt.org/datasets/spiral_datasets/PHercParis4/"
            echo "(SHA-256 of every input is recorded in both JSON reports.)"
            echo
            echo "## Reproduce"
            echo
            echo '```bash'
            echo 'scroliq-winding --dataset <PHercParis4 spiral-input root> --out PHercParis4.winding-audit.json'
            echo 'python bin/ray_order_control.py <PHercParis4 spiral-input root> injection-control.json --injections 200 --shifts 2,3,5 --seed 0'
            echo '```'
            echo
            echo "## Audit (first lines of summary.txt)"
            echo
            echo '```'
            sed -n '1,9p' "$out/summary.txt"
            echo '```'
            echo
            echo "## Injection control"
            echo
            echo "One real annotated point at a time is mis-numbered by ±shift and the"
            echo "check is rerun on otherwise unmodified data."
            echo
            echo '```'
            cat "$out/injection-control.txt"
            echo '```'
            echo
            echo "A ±2 error is undetectable by construction (the minimum compared"
            echo "winding gap is 2). Inversions are review candidates, not errors:"
            echo "folding can legitimately break ray order."
          } > "$out/README.md"

      - name: Commit audit artifacts
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-10-01-paris4-winding-ray-order
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add PHercParis4 winding ray-order audit and injection control artifacts"
          # Never push artifacts straight to main; a dispatch there lands on
          # the dedicated campaign branch instead.
          branch="${{ github.ref_name }}"
          if [ "$branch" = main ]; then branch=scroliq-paris4-ray-order; fi
          git push origin "HEAD:$branch"

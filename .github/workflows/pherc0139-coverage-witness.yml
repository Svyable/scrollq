name: PHerc0139 coverage witness deletion control

# Research issue #151. The scientific protocol is already frozen on main.
# This workflow only executes the create-only observation.
on:
  pull_request:
    paths:
      - ".github/workflows/pherc0139-coverage-witness.yml"
      - "scripts/research_coverage_witness_pherc0139.py"
      - "artifacts/2026-10-03-coverage-witness-pherc0139-run/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Guard measured output
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/2026-10-03-coverage-witness-pherc0139-run/result.json"
          if [ -e "$out" ]; then
            echo "coverage-witness result already exists; frozen"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned repository environment
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .

      - name: Self-test counterfactual geometry machinery
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euxo pipefail
          python scripts/research_coverage_witness_pherc0139.py --self-test

      - name: Fetch exact frozen w035 TIFXYZ
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          mesh="input/20260317000000-on-20250728140407-9.362um.tifxyz"
          base="https://vesuvius-challenge-open-data.s3.amazonaws.com/PHerc0139/segments/20260317000000-w035_2026031718/mesh/20260317000000-on-20250728140407-9.362um.tifxyz"
          mkdir -p "$mesh"
          for f in x.tif y.tif z.tif meta.json; do
            curl -fsSL --retry 4 --retry-delay 2 -o "$mesh/$f" "$base/$f"
          done
          if curl -fsSL --retry 2 --retry-delay 2 -o "$mesh/mask.tif" "$base/mask.tif"; then
            echo "mask.tif present"
          else
            rm -f "$mesh/mask.tif"
            echo "mask.tif absent"
          fi

      - name: Record frozen input hashes
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          outdir="artifacts/2026-10-03-coverage-witness-pherc0139-run"
          {
            sha256sum artifacts/2026-10-03-coverage-witness-pherc0139-prereg/spec.json
            sha256sum artifacts/2026-10-03-pherc0139-sheetness-prereg/reference-plan.json
            sha256sum artifacts/2026-10-03-pherc0139-wrong-wrap-prereg/wrong-wrap-spec.json
            sha256sum input/20260317000000-on-20250728140407-9.362um.tifxyz/{meta.json,x.tif,y.tif,z.tif}
          } > "$outdir/inputs.sha256"
          cat "$outdir/inputs.sha256"

      - name: Run frozen real-papyrus deletion control
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          outdir="artifacts/2026-10-03-coverage-witness-pherc0139-run"
          python scripts/research_coverage_witness_pherc0139.py \
            --spec artifacts/2026-10-03-coverage-witness-pherc0139-prereg/spec.json \
            --tifxyz input/20260317000000-on-20250728140407-9.362um.tifxyz \
            --out "$outdir/result.json" \
            | tee "$outdir/run.log"

      - name: Verify frozen observation contract
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          outdir = Path("artifacts/2026-10-03-coverage-witness-pherc0139-run")
          result = json.loads((outdir / "result.json").read_text())
          spec = Path("artifacts/2026-10-03-coverage-witness-pherc0139-prereg/spec.json")
          spec_sha = hashlib.sha256(spec.read_bytes()).hexdigest()

          assert result["schema"] == "scrollq-research-coverage-witness-pherc0139-result/1"
          assert result["status"] == "measured"
          assert result["spec"]["sha256"] == spec_sha
          assert len(result["centers"]) == 6
          assert len(result["variants"]) == 18
          assert result["independent_witness_source"]["missing_prediction_chunks"] == 0
          assert result["independent_witness_source"]["missing_ct_chunks"] == 0
          assert result["decision"]["status"] in {"pass", "fail"}
          print("observation contract PASS; decision=", result["decision"]["status"])
          print(
              "min witness count=",
              result["descriptive_witness_support"]["min_count"],
              "median witness fraction=",
              result["descriptive_witness_support"]["median_fraction"],
          )
          PY

      - name: Record environment
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          outdir="artifacts/2026-10-03-coverage-witness-pherc0139-run"
          {
            python --version
            python -m pip freeze
          } > "$outdir/environment.txt"

      - name: Commit measured result to campaign branch
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-10-03-coverage-witness-pherc0139-run
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Measure PHerc0139 coverage witness deletion control"
          branch="${{ github.head_ref || github.ref_name }}"
          if [ "$branch" = main ]; then
            branch=campaign/pherc0139-coverage-witness
          fi
          git push origin "HEAD:$branch"

name: PHerc0139 fiber census

on:
  push:
    paths:
      - ".github/workflows/pherc0139-fiber-census.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Run
        continue-on-error: true
        run: python scripts/fiber_scroll_census.py --scroll PHerc0139 --out out/r/summary.json
      - name: Print result
        if: always()
        run: |
          python -c "import json; d=json.load(open('out/r/summary.json')); print(json.dumps({k: v for k, v in d.items() if k not in ('rows', 'per_fiber', 'per_fiber_mean_abs_dot')}, indent=1))"
      - name: Commit result (create-only)
        run: scripts/ci_commit_result.sh artifacts/2026-10-04-pherc0139-fiber-census "Add PHerc0139 fiber census result" out/r/summary.json

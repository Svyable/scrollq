name: PHerc0139 fiber replications (pre-registered)

on:
  push:
    paths:
      - ".github/workflows/pherc0139-fiber-replications.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gap-rule-v2
            cmd: python scripts/fiber_gap_rule_eval.py --out-dir out/r --spec artifacts/2026-10-04-fiber-gap-rule-v2-pherc0139-prereg/spec.json
            dest: artifacts/2026-10-04-fiber-gap-rule-v2-pherc0139-run
          - name: ct-support
            cmd: python scripts/paris4_fiber_ct_support.py --out-dir out/r --workers 48 --spec artifacts/2026-10-04-pherc0139-fiber-ct-support-prereg/spec.json
            dest: artifacts/2026-10-04-pherc0139-fiber-ct-support-run
          - name: ct-direction
            cmd: python scripts/paris4_fiber_ct_direction.py --out-dir out/r --workers 16 --spec artifacts/2026-10-04-pherc0139-fiber-ct-direction-prereg/spec.json
            dest: artifacts/2026-10-04-pherc0139-fiber-ct-direction-run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Run
        continue-on-error: true
        run: ${{ matrix.cmd }}
      - name: Commit result (create-only)
        run: scripts/ci_commit_result.sh "${{ matrix.dest }}" "Add PHerc0139 ${{ matrix.name }} result" out/r/result.json

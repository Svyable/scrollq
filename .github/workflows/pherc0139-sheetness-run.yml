name: Execute frozen PHerc0139 sheetness Phase A

on:
  push:
    branches:
      - "campaign/pherc0139-sheetness-phase-a-*"
    paths:
      - ".github/workflows/pherc0139-sheetness-run.yml"
      - "bin/run_pherc0139_sheetness_phase_a.py"
      - "artifacts/2026-10-03-pherc0139-sheetness-run/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Guard create-only result
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          result="artifacts/2026-10-03-pherc0139-sheetness-run/sheetness-result.json"
          if [ -e "$result" ]; then
            echo "Phase-A sheetness result already exists; frozen"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Reconstruct frozen numerical environment
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          envfile="artifacts/2026-10-03-pherc0139-sheetness-campaign/environment.txt"
          grep -E '^[A-Za-z0-9_.-]+==[^[:space:]]+$' "$envfile" \
            > /tmp/pherc0139-frozen-constraints.txt
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-ci.txt \
            -c /tmp/pherc0139-frozen-constraints.txt
          python -m pip install \
            -e . \
            -c /tmp/pherc0139-frozen-constraints.txt

      - name: Execute frozen campaign
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          python bin/run_pherc0139_sheetness_phase_a.py --repo-root .

      - name: Commit create-only measured result
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-10-03-pherc0139-sheetness-run
          if git diff --cached --quiet; then
            echo "no measured outputs to commit"
            exit 0
          fi
          git commit -m "Run frozen PHerc0139 Phase-A sheetness campaign"
          git push origin "HEAD:$GITHUB_REF_NAME"

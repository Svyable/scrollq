name: PHerc0490A VC3D seed screen

on:
  push:
    branches:
      - agent/pherc0490a-first-letter-hunt
    paths:
      - .github/workflows/pherc0490a-vc3d-screen.yml

permissions:
  contents: read

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ScrolIQ branch
        run: python -m pip install -e .
      - name: Pull pinned VC3D image
        run: docker pull ghcr.io/scrollprize/villa/volume-cartographer@sha256:bad516f66001abca759454cc43e4fd11e5b19aa55d36bdc2043817291c8083c4
      - name: Grow all 12 frozen seeds
        shell: bash
        run: |
          set -u
          IMAGE='ghcr.io/scrollprize/villa/volume-cartographer@sha256:bad516f66001abca759454cc43e4fd11e5b19aa55d36bdc2043817291c8083c4'
          PRED='https://vesuvius-challenge-open-data.s3.amazonaws.com/PHerc0490A/representations/predictions/surfaces/20250521151210-surface-20260413222639-surface-m7-L0-th0.2.zarr'
          CTROOT='PHerc0490A/volumes/20250521151210-8.640um-1.2m-116keV-masked.zarr'
          PARAMS="$PWD/artifacts/2026-10-02-pherc0490a-first-letter-hunt/vc3d-screen-params.json"
          ROOT="$PWD/out/pherc0490a-vc3d-screen"
          mkdir -p "$ROOT"
          python - <<'PY' > "$ROOT/seeds.tsv"
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/2026-10-02-pherc0490a-first-letter-hunt/geometry-seed-receipt.json").read_text())
          for row in r["rows"]:
              z,y,x=row["global_zyx"]
              print(f'{row["rank"]}\t{x}\t{y}\t{z}')
          PY
          printf 'rank\tx\ty\tz\tvc_rc\tsegment\tmesh_rc\tvoxelsize_ok\tseed_value_ok\n' > "$ROOT/results.tsv"
          while IFS=$'\t' read -r rank x y z; do
            printf -v tag 'seed-%02d' "$rank"
            d="$ROOT/$tag"
            mkdir -p "$d"
            set +e
            docker run --rm \
              --ulimit nofile=750000:750000 \
              -v "$d:/out" \
              -v "$PARAMS:/params.json:ro" \
              "$IMAGE" \
              vc_grow_seg_from_seed \
                -v "$PRED" \
                -t /out \
                -p /params.json \
                --seed "$x" "$y" "$z" \
              >"$d/grow.log" 2>&1
            rc=$?
            set -e
            segment="$(find "$d" -mindepth 1 -maxdepth 1 -type d -name 'auto_grown_*' | sort | head -1)"
            vox_ok=0
            seed_ok=0
            grep -Eq 'voxelsize: 8\.64([0-9]*)?' "$d/grow.log" && vox_ok=1 || true
            grep -Eq 'seed location .* value is (1[2-9][8-9]|1[3-9][0-9]|2[0-9][0-9])' "$d/grow.log" && seed_ok=1 || true
            mesh_rc=99
            if [ "$rc" -eq 0 ] && [ -n "$segment" ] && [ -f "$segment/meta.json" ] && [ -f "$segment/x.tif" ] && [ -f "$segment/y.tif" ] && [ -f "$segment/z.tif" ]; then
              set +e
              scroliq-mesh \
                --tifxyz "$segment" \
                --volume-root "$CTROOT" \
                --out "$d/mesh-audit.json" \
                >"$d/mesh-audit.log" 2>&1
              mesh_rc=$?
              set -e
            fi
            rel="${segment#$PWD/}"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$rank" "$x" "$y" "$z" "$rc" "$rel" "$mesh_rc" "$vox_ok" "$seed_ok" \
              >> "$ROOT/results.tsv"
          done < "$ROOT/seeds.tsv"
          cat "$ROOT/results.tsv"
      - name: Build immutable screening receipt
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root=Path("out/pherc0490a-vc3d-screen")
          rows=[]
          with (root/"results.tsv").open() as f:
              for r in csv.DictReader(f, delimiter="\t"):
                  d=root/f'seed-{int(r["rank"]):02d}'
                  log=d/"grow.log"
                  mesh=d/"mesh-audit.json"
                  row={
                    "rank":int(r["rank"]),
                    "seed_xyz":[int(r["x"]),int(r["y"]),int(r["z"])],
                    "vc_return_code":int(r["vc_rc"]),
                    "segment_path":r["segment"] or None,
                    "mesh_return_code":int(r["mesh_rc"]),
                    "voxelsize_log_check":r["voxelsize_ok"]=="1",
                    "seed_value_log_check":r["seed_value_ok"]=="1",
                    "grow_log_sha256":hashlib.sha256(log.read_bytes()).hexdigest() if log.is_file() else None,
                    "mesh_audit_sha256":hashlib.sha256(mesh.read_bytes()).hexdigest() if mesh.is_file() else None,
                  }
                  if mesh.is_file():
                      m=json.loads(mesh.read_text())
                      row["mesh_audit_status"]=m.get("status")
                      row["mesh_findings"]=m.get("findings",[])
                  rows.append(row)
          receipt={
            "schema_version":1,
            "kind":"pherc0490a-vc3d-seed-screen",
            "image":"ghcr.io/scrollprize/villa/volume-cartographer@sha256:bad516f66001abca759454cc43e4fd11e5b19aa55d36bdc2043817291c8083c4",
            "surface_prediction":"https://vesuvius-challenge-open-data.s3.amazonaws.com/PHerc0490A/representations/predictions/surfaces/20250521151210-surface-20260413222639-surface-m7-L0-th0.2.zarr",
            "ct_volume_root":"PHerc0490A/volumes/20250521151210-8.640um-1.2m-116keV-masked.zarr",
            "params_path":"artifacts/2026-10-02-pherc0490a-first-letter-hunt/vc3d-screen-params.json",
            "denominator":12,
            "rows":rows,
            "claim_boundary":"Eight-generation patches are geometry screening artifacts only. A successful trace or clean mesh audit does not establish correct sheet identity, recto/verso, ink, or a letter."
          }
          (root/"screen-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
            "grown":sum(bool(r["segment_path"]) for r in rows),
            "vc_success":sum(r["vc_return_code"]==0 for r in rows),
            "mesh_audited":sum(r["mesh_audit_sha256"] is not None for r in rows),
            "voxelsize_ok":sum(r["voxelsize_log_check"] for r in rows),
            "seed_value_ok":sum(r["seed_value_log_check"] for r in rows),
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pherc0490a-vc3d-seed-screen
          path: out/pherc0490a-vc3d-screen
          if-no-files-found: error
          retention-days: 30

name: PHerc1667 scan control

on:
  workflow_dispatch:
  push:
    branches:
      - scroliq-pherc1667-scan-control
    paths:
      - .github/workflows/pherc1667-scan-control.yml

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .

      - name: Run PHerc1667 spatial control
        run: |
          set -euxo pipefail
          out="artifacts/2026-09-30-pherc1667-scan-control"
          mkdir -p "$out"
          root="community-uploads/forrest/volcomp/PHerc1667/volumes/20251217075048-2.399um-0.2m-78keV-masked.zarr"

          scroliq-scan-map \
            --root "$root" \
            --grid 6 \
            --chunks-per-shard 1 \
            --out "$out/PHerc1667.scan-map.json"

      - name: Compare with exact Grand Prize target surveys
        env:
          CONTROL_SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          out = Path("artifacts/2026-09-30-pherc1667-scan-control")
          control = json.loads((out / "PHerc1667.scan-map.json").read_text())
          targets = json.loads(
              Path("artifacts/2026-09-30-spatial-scan-campaign/summary.json").read_text()
          )

          keys = ("nonzero_frac", "grad_energy", "dyn_range", "sat_frac")

          def interval_overlap(a, b):
              lo = max(float(a["p10"]), float(b["p10"]))
              hi = min(float(a["p90"]), float(b["p90"]))
              intersection = max(0.0, hi - lo)
              union_lo = min(float(a["p10"]), float(b["p10"]))
              union_hi = max(float(a["p90"]), float(b["p90"]))
              union = max(0.0, union_hi - union_lo)
              return {
                  "intersection": round(intersection, 6),
                  "union": round(union, 6),
                  "jaccard": round(intersection / union, 6) if union else None,
              }

          comparisons = {}
          for row in targets["rows"]:
              scroll = row["scroll"]
              comparisons[scroll] = {}
              for key in keys:
                  a = control["metric_distribution"].get(key)
                  b = row["metric_distribution"].get(key)
                  if a and b:
                      comparisons[scroll][key] = {
                          "control": a,
                          "target": b,
                          "central80_interval_overlap": interval_overlap(a, b),
                      }

          report = {
              "schema_version": "1.0",
              "campaign": "2026-09-30-pherc1667-scan-control",
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_commit": os.environ["CONTROL_SOURCE_SHA"],
              "control": {
                  "scroll": "PHerc1667",
                  "root": control["root"],
                  "sampling": control["sampling"],
                  "metric_distribution": control["metric_distribution"],
                  "known_scroll_level_outcome": (
                      "PHerc1667 was publicly announced as completely virtually "
                      "unwrapped and read on 2026-06-25."
                  ),
                  "outcome_source": "https://scrollprize.org/firstscroll",
                  "limitation": (
                      "This is a scroll-level known-success control. The sampled "
                      "voxel boxes are not yet aligned to the published readable "
                      "surface, so this is not local ground truth."
                  ),
              },
              "target_comparisons": comparisons,
              "interpretation": (
                  "Central-80 interval overlap is descriptive only. It can falsify "
                  "naive universal thresholds when a target range overlaps a known-"
                  "success scroll range, but it cannot prove scan quality or causality."
              ),
              "next_validation": (
                  "Align sampled voxel boxes to published PHerc1667 surface/mesh "
                  "coordinates and compare diagnostics against locally verified "
                  "successful and difficult unwrapping regions."
              ),
          }
          (out / "comparison.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )

          lines = []
          for target, metrics in comparisons.items():
              for key, value in metrics.items():
                  overlap = value["central80_interval_overlap"]
                  lines.append(
                      f"| {target} | {key} | "
                      f"{value['control']['p10']}–{value['control']['p90']} | "
                      f"{value['target']['p10']}–{value['target']['p90']} | "
                      f"{overlap['jaccard']} |"
                  )

          table_rows = "\n".join(lines)
          readme = f"""# PHerc1667 spatial-scan control — 2026-09-30

          PHerc1667 is the Challenge's first completely virtually unwrapped and
          read Herculaneum scroll. This campaign uses ScrolIQ's public 2.399 µm
          PHerc1667 volume as a **scroll-level known-success control** for the raw
          spatial CT metrics used on PHerc0813 and PHerc1447.

          Official outcome source: https://scrollprize.org/firstscroll

          ## Reproduce

          ```bash
          scroliq-scan-map --root community-uploads/forrest/volcomp/PHerc1667/volumes/20251217075048-2.399um-0.2m-78keV-masked.zarr --grid 6 --chunks-per-shard 1 --out PHerc1667.scan-map.json
          ```

          Source commit: `{os.environ['CONTROL_SOURCE_SHA']}`.

          ## Descriptive central-80% overlap

          | Target | Metric | PHerc1667 p10–p90 | Target p10–p90 | interval Jaccard |
          |---|---|---:|---:|---:|
          {table_rows}

          Interval overlap is not a quality score. It is a guard against inventing
          universal thresholds from visually appealing statistics: substantial
          overlap with a successfully read scroll means that metric alone cannot
          justify calling the same value a failure on a target scroll.

          ## Critical limitation

          This control is **scroll-level, not local ground truth**. The sampled
          level-0 voxel boxes have not yet been intersected with the published
          PHerc1667 surface/mesh coordinates. The next validation must perform
          that coordinate alignment and compare ScrolIQ diagnostics against
          locally verified successful and difficult unwrapping regions.
          """
          readme = "\n".join(line.strip() for line in readme.splitlines()) + "\n"
          (out / "README.md").write_text(readme, encoding="utf-8")
          PY

      - name: Commit control artifacts
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-09-30-pherc1667-scan-control
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add PHerc1667 spatial scan control artifacts"
          git push origin HEAD:scroliq-pherc1667-scan-control

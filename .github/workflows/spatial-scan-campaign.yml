name: Spatial scan campaign

on:
  workflow_dispatch:
  push:
    branches:
      - scroliq-spatial-scan-campaign
    paths:
      - .github/workflows/spatial-scan-campaign.yml

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .

      - name: Run exact-volume spatial surveys
        run: |
          set -euxo pipefail
          out="artifacts/2026-09-30-spatial-scan-campaign"
          mkdir -p "$out"

          root_0813="community-uploads/forrest/volcomp/PHerc0813/volumes/20250821151723-9.362um-1.2m-113keV-masked.zarr"
          root_1447="community-uploads/forrest/volcomp/PHerc1447/volumes/20250521151220-8.640um-1.2m-116keV-masked.zarr"

          scroliq-scan-map --root "$root_0813" --grid 4 --chunks-per-shard 1 \
            --out "$out/PHerc0813.scan-map.json"
          scroliq-scan-map --root "$root_1447" --grid 4 --chunks-per-shard 1 \
            --out "$out/PHerc1447.scan-map.json"

          scroliq-passport \
            --volumes artifacts/2026-09-30-scrollq/volumes.json \
            --coverage artifacts/2026-09-30-scrollq/coverage.json \
            --root "$root_0813" \
            --scan-map "$out/PHerc0813.scan-map.json" \
            --out "$out/PHerc0813.passport.json"

          scroliq-passport \
            --volumes artifacts/2026-09-30-scrollq/volumes.json \
            --coverage artifacts/2026-09-30-scrollq/coverage.json \
            --root "$root_1447" \
            --scan-map "$out/PHerc1447.scan-map.json" \
            --out "$out/PHerc1447.passport.json"

      - name: Build campaign summary
        env:
          CAMPAIGN_SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          out = Path("artifacts/2026-09-30-spatial-scan-campaign")
          rows = []
          for scroll in ("PHerc0813", "PHerc1447"):
              report = json.loads((out / f"{scroll}.scan-map.json").read_text())
              rows.append({
                  "scroll": scroll,
                  "root": report["root"],
                  "ok": report["ok"],
                  "coordinate_space": report["coordinate_space"],
                  "sampling": report["sampling"],
                  "metric_distribution": report["metric_distribution"],
              })

          summary = {
              "schema_version": "1.0",
              "campaign": "2026-09-30-spatial-scan-campaign",
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_commit": os.environ["CAMPAIGN_SOURCE_SHA"],
              "parameters": {
                  "grid_per_dimension": 4,
                  "chunks_per_shard": 1,
                  "level": 0,
                  "base_url": "https://dl.ash2txt.org",
              },
              "selection": (
                  "Two exact 2027 Grand Prize volume IDs selected from the frozen "
                  "2026-09-30 target manifest; no same-scroll higher-resolution substitute."
              ),
              "rows": rows,
              "interpretation": (
                  "This campaign establishes coordinate-preserving local CT evidence. "
                  "It does not label compression, decohesion, surface correctness, ink "
                  "presence, readability, or Grand Prize readiness."
              ),
          }
          (out / "summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )

          def line(row):
              sampling = row["sampling"]
              statuses = ", ".join(
                  f"{k}={v}" for k, v in sorted(sampling["status_counts"].items())
              )
              grad = row["metric_distribution"].get("grad_energy", {})
              dyn = row["metric_distribution"].get("dyn_range", {})
              return (
                  f"| {row['scroll']} | {sampling['candidate_shards']} | "
                  f"{sampling['chunks_decoded']} | {statuses} | "
                  f"{grad.get('min', 'n/a')}–{grad.get('max', 'n/a')} | "
                  f"{dyn.get('min', 'n/a')}–{dyn.get('max', 'n/a')} |"
              )

          table_rows = "\n".join(line(row) for row in rows)
          readme = f"""# Spatial scan campaign — 2026-09-30

          This artifact is the first real-data run of `scroliq-scan-map`.
          It uses the exact prize-eligible volumes for PHerc0813 and PHerc1447
          recorded in ScrolIQ's frozen Grand Prize manifest.

          ## Reproduce

          ```bash
          scroliq-scan-map --root community-uploads/forrest/volcomp/PHerc0813/volumes/20250821151723-9.362um-1.2m-113keV-masked.zarr --grid 4 --chunks-per-shard 1 --out PHerc0813.scan-map.json
          scroliq-scan-map --root community-uploads/forrest/volcomp/PHerc1447/volumes/20250521151220-8.640um-1.2m-116keV-masked.zarr --grid 4 --chunks-per-shard 1 --out PHerc1447.scan-map.json
          ```

          Base URL: `https://dl.ash2txt.org`. Level: full-resolution L0.
          Source commit: `{os.environ['CAMPAIGN_SOURCE_SHA']}`.

          ## Observed survey coverage

          | Scroll | Candidate shards | Chunks decoded | Spatial states | Gradient-energy range | Dynamic-range range |
          |---|---:|---:|---|---:|---:|
          {table_rows}

          See `summary.json` for machine-readable campaign metadata and each
          `*.scan-map.json` for level-0 voxel bounding boxes and local metrics.

          ## Scope

          These outputs demonstrate local coordinate-preserving CT diagnostics.
          They do **not** yet establish that a region is compressed, decohered,
          correctly surfaced, ink-bearing, readable, or Grand Prize ready.
          Physical interpretation is the next validation step.
          """
          readme = "\n".join(line.strip() for line in readme.splitlines()) + "\n"
          (out / "README.md").write_text(readme, encoding="utf-8")
          PY

      - name: Commit reproducible campaign artifacts
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-09-30-spatial-scan-campaign
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add real-data spatial scan campaign artifacts"
          git push origin HEAD:scroliq-spatial-scan-campaign

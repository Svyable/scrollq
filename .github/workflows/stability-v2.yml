name: Stability v2 (pre-registered)

# Manual only. Run after docs/stability-v2-protocol.md is on main, so the
# pre-registration commit precedes every data read.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .

      - name: Run the pre-registered test
        run: |
          set -euxo pipefail
          out="artifacts/2026-10-stability-v2"
          python bin/stability_v2.py "$out" --workers 8 | tee "$out.log"
          mv "$out.log" "$out/run.log"

      - name: Commit results
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-10-stability-v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add pre-registered stability v2 results"
          branch="${{ github.ref_name }}"
          if [ "$branch" = main ]; then branch=scroliq-stability-v2; fi
          git push origin "HEAD:$branch"

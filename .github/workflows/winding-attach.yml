name: Winding attachment (pre-registered)

# October goal O2, step 3. Runs after docs/winding-attachment-protocol.md is
# committed, so the pre-registration precedes every read of patch geometry:
# by hand, or on a PR that changes this file. Commits results to the PR (or
# dispatching) branch, never to main, and skips once the dated results exist
# so frozen data is never overwritten. Once they exist, it only adds the
# post-hoc review context (bin/winding_attach_review.py) if that is missing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/winding-attach.yml

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Skip if the dated results already exist
        id: guard
        run: |
          d=artifacts/2026-10-03-paris4-winding-attachment
          if [ -e "$d/result.json" ]; then
            echo "results exist; frozen" && echo "skip=1" >> "$GITHUB_OUTPUT"
            if [ -e "$d/review-context.json" ]; then echo "done=1" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != '1'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        if: steps.guard.outputs.done != '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .
      - name: Fetch PHercParis4 spiral-input annotations
        if: steps.guard.outputs.done != '1'
        run: |
          set -euxo pipefail
          base="https://dl.ash2txt.org/datasets/spiral_datasets/PHercParis4"
          mkdir -p input
          for f in umbilicus.json abs_winding.json relative_windings.json; do
            curl -fsSL --retry 4 -o "input/$f" "$base/$f"
          done
          curl -fsSL --retry 4 -o verified_patches.html "$base/verified_patches/"
          sha256sum input/*.json verified_patches.html
      - name: Run the pre-registered analysis
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euxo pipefail
          out="artifacts/2026-10-03-paris4-winding-attachment"
          python bin/winding_attach.py input verified_patches.html \
            https://dl.ash2txt.org/datasets/spiral_datasets/PHercParis4/verified_patches \
            "$out" --workers 32 | tee run.log
          mv run.log "$out/run.log"
      - name: Post-hoc review context (descriptive, not the decision)
        if: steps.guard.outputs.done != '1'
        run: |
          python bin/winding_attach_review.py artifacts/2026-10-03-paris4-winding-attachment input \
            > artifacts/2026-10-03-paris4-winding-attachment/review-context.json
          cat artifacts/2026-10-03-paris4-winding-attachment/review-context.json
      - name: Commit results
        if: steps.guard.outputs.done != '1'
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-10-03-paris4-winding-attachment
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add PHercParis4 winding attachment results"
          branch="${{ github.head_ref || github.ref_name }}"
          if [ "$branch" = main ]; then branch=scroliq-winding-attachment; fi
          git push origin "HEAD:$branch"

name: Winding attachment (pre-registered)

# October goal O2, step 3. Manual only: dispatch after
# docs/winding-attachment-protocol.md is committed, so the pre-registration
# precedes every read of patch geometry. Commits results to the dispatching
# branch; never pushes to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .
      - name: Fetch PHercParis4 spiral-input annotations
        run: |
          set -euxo pipefail
          base="https://dl.ash2txt.org/datasets/spiral_datasets/PHercParis4"
          mkdir -p input
          for f in umbilicus.json abs_winding.json relative_windings.json; do
            curl -fsSL --retry 4 -o "input/$f" "$base/$f"
          done
          curl -fsSL --retry 4 -o verified_patches.html "$base/verified_patches/"
          sha256sum input/*.json verified_patches.html
      - name: Run the pre-registered analysis
        run: |
          set -euxo pipefail
          out="artifacts/2026-10-03-paris4-winding-attachment"
          python bin/winding_attach.py input verified_patches.html \
            https://dl.ash2txt.org/datasets/spiral_datasets/PHercParis4/verified_patches \
            "$out" --workers 32 | tee run.log
          mv run.log "$out/run.log"
      - name: Commit results
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-10-03-paris4-winding-attachment
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add pre-registered PHercParis4 winding attachment results"
          branch="${{ github.ref_name }}"
          if [ "$branch" = main ]; then branch=scroliq-winding-attachment; fi
          git push origin "HEAD:$branch"

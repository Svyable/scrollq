[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrollq"
version = "0.1.0"
description = "Train on the best first: data-quality scores for Vesuvius scroll volumes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sven" }]
keywords = ["vesuvius", "herculaneum", "scroll", "data-quality", "zarr", "ct"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "requests",
    "zarr-pyramid-audit>=0.3.0",
]

[project.urls]
Homepage = "https://svyable.github.io/scrollq/"
Repository = "https://github.com/Svyable/scrollq"
Issues = "https://github.com/Svyable/scrollq/issues"

[project.scripts]
scrollq-score = "scrollq.cli:main"
scrollq-leaderboard = "scrollq.leaderboard:main"
scrollq-coverage = "scrollq.coverage:main"
scrollq-health = "scrollq.health:main"
scrollq-grand-prize = "scrollq.grand_prize:main"

[tool.setuptools.packages.find]
where = ["src"]

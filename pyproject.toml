[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrollq"
version = "0.1.0"
description = "Challenge-aligned diagnostics for Vesuvius scroll data and virtual unwrapping"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sven" }]
keywords = ["vesuvius", "herculaneum", "scroll", "data-quality", "zarr", "ct"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numcodecs",
    "numpy",
    "Pillow",
    "requests",
    "tifffile>=2024.1",
    "zarr-pyramid-audit @ git+https://github.com/Svyable/zarr-pyramid-audit.git",
]

[project.urls]
Homepage = "https://svyable.github.io/scrollq/"
Repository = "https://github.com/Svyable/scrollq"
Issues = "https://github.com/Svyable/scrollq/issues"

[project.scripts]
scrollq-score = "scrollq.cli:main"
scrollq-leaderboard = "scrollq.leaderboard:main"
scrollq-coverage = "scrollq.coverage:main"
scrollq-health = "scrollq.health:main"
scrollq-grand-prize = "scrollq.grand_prize:main"
scroliq-support = "scrollq.support:main"
scrollq-geometry-probe = "scrollq.geometry_probe:main"
scroliq-passport = "scrollq.passport:main"
scroliq-scan-map = "scrollq.scan_map:main"
scroliq-provenance = "scrollq.provenance:main"
scroliq-ink-validate = "scrollq.ink_validation:main"
scroliq-winding = "scrollq.winding_audit:main"
scroliq-mesh = "scrollq.tifxyz_audit:main"
scroliq-ink-audit = "scrollq.ink_audit:main"
scroliq-recto-coverage = "scrollq.recto_coverage:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrollq"
version = "0.1.0"
description = "Train on the best first: data-quality scores for Vesuvius scroll volumes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sven" }]
dependencies = [
    "numpy",
    "requests",
    "zarr-pyramid-audit>=0.3.0",
]

[project.scripts]
scrollq-score = "scrollq.cli:main"
scrollq-leaderboard = "scrollq.leaderboard:main"
scrollq-coverage = "scrollq.coverage:main"
scrollq-health = "scrollq.health:main"\nscrollq-grand-prize = "scrollq.grand_prize:main"

[tool.setuptools.packages.find]
where = ["src"]

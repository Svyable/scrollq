[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrollq"
version = "0.1.0"
description = "Challenge-aligned diagnostics for Vesuvius scroll data and virtual unwrapping"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sven" }]
dependencies = [
    "numpy",
    "requests",
    "zarr-pyramid-audit @ git+https://github.com/Svyable/zarr-pyramid-audit.git",
]

[project.scripts]
scrollq-score = "scrollq.cli:main"
scrollq-leaderboard = "scrollq.leaderboard:main"
scrollq-coverage = "scrollq.coverage:main"
scrollq-health = "scrollq.health:main"
scrollq-grand-prize = "scrollq.grand_prize:main"
scrollq-geometry-probe = "scrollq.geometry_probe:main"
scroliq-passport = "scrollq.passport:main"
scroliq-scan-map = "scrollq.scan_map:main"
scroliq-provenance = "scrollq.provenance:main"

[tool.setuptools.packages.find]
where = ["src"]
